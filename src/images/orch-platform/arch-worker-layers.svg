<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .t  { font-size: 15px; font-weight: bold; fill: #1f2328; }
    .s  { font-size: 12px; fill: #444; }
    .k  { font-size: 12px; fill: #6a737d; font-style: italic; }
    .or { fill: #e8f0fe; stroke: #4a6fd1; stroke-width: 1.5; }
    .nw { fill: #fff1e0; stroke: #e08a1e; stroke-width: 1.5; }
    .ku { fill: #eaf6ec; stroke: #3c9a54; stroke-width: 1.5; }
    .ln { stroke: #444; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- von oben nach unten: Projekt erbt von Umgebung erbt von Plattform erbt von Orchescala -->
  <rect x="40" y="20" width="620" height="70" rx="8" class="ku"/>
  <text x="60" y="48" class="t">acme-&lt;projekt&gt;</text>
  <text x="60" y="70" class="s">erbt vom Basis-Worker · definiert nur apiUri, Mapping, Fachlogik</text>
  <text x="680" y="60" class="k">pro Projekt</text>

  <line x1="350" y1="90" x2="350" y2="122" class="ln" marker-end="url(#arrow)"/>
  <text x="360" y="111" class="k">erbt</text>

  <rect x="40" y="126" width="620" height="70" rx="8" class="ku"/>
  <text x="60" y="154" class="t">acme-orchescala</text>
  <text x="60" y="176" class="s">Basis-Worker der Umgebung: AcmeServiceWorkerDsl, AcmePersistenceWorkerDsl …</text>
  <text x="680" y="158" class="k">pro Kunde/Umgebung</text>
  <text x="680" y="176" class="k">Werte aus Env/Secrets</text>

  <line x1="350" y1="196" x2="350" y2="228" class="ln" marker-end="url(#arrow)"/>
  <text x="360" y="217" class="k">nutzt</text>

  <rect x="40" y="232" width="620" height="70" rx="8" class="nw"/>
  <text x="60" y="260" class="t">orch-platform (z9nai)</text>
  <text x="60" y="282" class="s">Bausteine: Token-Weitergabe, Client Credentials, API-Gateway-Header, DataSource aus Env …</text>
  <text x="680" y="270" class="k">neu, wiederverwendbar</text>

  <line x1="350" y1="302" x2="350" y2="334" class="ln" marker-end="url(#arrow)"/>
  <text x="360" y="323" class="k">baut auf</text>

  <rect x="40" y="338" width="620" height="70" rx="8" class="or"/>
  <text x="60" y="366" class="t">orchescala</text>
  <text x="60" y="388" class="s">ServiceWorkerDsl · CustomWorkerDsl · PersistenceWorkerDsl (neu)</text>
  <text x="680" y="376" class="k">Framework</text>
</svg>
