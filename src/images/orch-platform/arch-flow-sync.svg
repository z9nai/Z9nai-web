<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .t  { font-size: 14px; font-weight: bold; fill: #1f2328; }
    .l  { font-size: 12px; fill: #333; }
    .g  { font-size: 12px; fill: #57606a; font-weight: bold; }
    .band { fill: #f3f4f6; }
    .or { fill: #e8f0fe; stroke: #4a6fd1; stroke-width: 1.5; }
    .nw { fill: #fff1e0; stroke: #e08a1e; stroke-width: 1.5; }
    .ex { fill: #f4f4f4; stroke: #8a8a8a; stroke-dasharray: 6 4; stroke-width: 1.5; }
    .life { stroke: #b0b7c0; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .m  { stroke: #444; stroke-width: 1.5; fill: none; }
    .r  { stroke: #444; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <rect width="960" height="690" fill="#ffffff"/>

  <rect x="0" y="74"  width="960" height="22" class="band"/>
  <rect x="0" y="254" width="960" height="22" class="band"/>

  <!-- Teilnehmer: x = 100, 290, 480, 670, 860 -->
  <rect x="30"  y="20" width="140" height="44" rx="6" class="nw"/><text x="100" y="47" text-anchor="middle" class="t">Browser · UI</text>
  <rect x="220" y="20" width="140" height="44" rx="6" class="or"/><text x="290" y="47" text-anchor="middle" class="t">Gateway</text>
  <rect x="410" y="20" width="140" height="44" rx="6" class="or"/><text x="480" y="47" text-anchor="middle" class="t">Worker-App</text>
  <rect x="600" y="20" width="140" height="44" rx="6" class="ex"/><text x="670" y="47" text-anchor="middle" class="t">API-Gateway</text>
  <rect x="790" y="20" width="140" height="44" rx="6" class="ex"/><text x="860" y="47" text-anchor="middle" class="t">Kernbanksystem</text>

  <line x1="100" y1="64" x2="100" y2="670" class="life"/>
  <line x1="290" y1="64" x2="290" y2="670" class="life"/>
  <line x1="480" y1="64" x2="480" y2="670" class="life"/>
  <line x1="670" y1="64" x2="670" y2="670" class="life"/>
  <line x1="860" y1="64" x2="860" y2="670" class="life"/>

  <text x="112" y="89" class="g">UI laden</text>
  <line x1="100" y1="124" x2="286" y2="124" class="m" marker-end="url(#arrow)"/>
  <text x="110" y="116" class="l">GET /app/acme-konto/…</text>
  <line x1="290" y1="160" x2="476" y2="160" class="m" marker-end="url(#arrow)"/>
  <text x="300" y="152" class="l">weiterleiten an acme-konto:5555</text>
  <line x1="480" y1="196" x2="294" y2="196" class="r" marker-end="url(#arrow)"/>
  <text x="300" y="188" class="l">index.html, JS, CSS</text>
  <line x1="290" y1="232" x2="104" y2="232" class="r" marker-end="url(#arrow)"/>
  <text x="110" y="224" class="l">unverändert</text>

  <text x="112" y="269" class="g">Worker aufrufen</text>
  <line x1="100" y1="304" x2="286" y2="304" class="m" marker-end="url(#arrow)"/>
  <text x="110" y="296" class="l">POST /worker/{topic} (Bearer)</text>
  <path d="M290,326 h40 v24 h-36" class="m" marker-end="url(#arrow)"/>
  <text x="338" y="342" class="l">Token prüfen (JWT)</text>
  <line x1="290" y1="396" x2="476" y2="396" class="m" marker-end="url(#arrow)"/>
  <text x="300" y="372" class="l">weiterleiten an acme-konto:5555</text>
  <text x="300" y="388" class="l">Body + Token unverändert</text>
  <line x1="480" y1="436" x2="666" y2="436" class="m" marker-end="url(#arrow)"/>
  <text x="490" y="428" class="l">REST (Auth aus Basis-Worker)</text>
  <line x1="670" y1="476" x2="856" y2="476" class="m" marker-end="url(#arrow)"/>
  <text x="680" y="468" class="l">REST</text>
  <line x1="860" y1="516" x2="674" y2="516" class="r" marker-end="url(#arrow)"/>
  <text x="790" y="508" class="l">Antwort</text>
  <line x1="670" y1="556" x2="484" y2="556" class="r" marker-end="url(#arrow)"/>
  <text x="600" y="548" class="l">Antwort</text>
  <line x1="480" y1="596" x2="294" y2="596" class="r" marker-end="url(#arrow)"/>
  <text x="300" y="588" class="l">Out (gemappt)</text>
  <line x1="290" y1="636" x2="104" y2="636" class="r" marker-end="url(#arrow)"/>
  <text x="110" y="628" class="l">Out (unverändert)</text>
</svg>
